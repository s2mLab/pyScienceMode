name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Lenient rule set for now (syntax errors, undefined names, invalid comparisons):
      # to be tightened once the codebase is cleaned up.
      - run: ruff check --select E9,F63,F7,F82 --output-format github .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The P24 backend (sciencemode_cffi wheel) is Windows/cp310 only and is not installed:
      # hardware tests are skipped anyway since no --port / PYSCIENCEMODE_PORT is given.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Import check
        run: python -c "import pysciencemode; print(pysciencemode.__file__)"
      - name: Pytest (no hardware)
        run: python -m pytest tests -rs
